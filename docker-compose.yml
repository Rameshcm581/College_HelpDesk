services:
  helpdesk_db:
    image: pgvector/pgvector:pg16
    container_name: helpdesk_pgvector_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-college_helpdesk_db}
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk_dev_pass}
    ports:
      - "5435:5432"
    volumes:
      - helpdesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helpdesk_user} -d ${POSTGRES_DB:-college_helpdesk_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  helpdesk_redis:
    image: redis:7-alpine
    container_name: helpdesk_redis_cache
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-helpdesk_redis_pass} --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - helpdesk_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-helpdesk_redis_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  helpdesk_backend:
    build:
      context: ./backend/Services/HelpdeskService
      dockerfile: Dockerfile
    container_name: helpdesk_api_server
    restart: unless-stopped
    environment:
      APP_ENV: dev
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-32-chars-minimum-xx}
      DB_URI: postgresql+asyncpg://${POSTGRES_USER:-helpdesk_user}:${POSTGRES_PASSWORD:-helpdesk_dev_pass}@helpdesk_db:5432/${POSTGRES_DB:-college_helpdesk_db}
      SYNC_DB_URI: postgresql://${POSTGRES_USER:-helpdesk_user}:${POSTGRES_PASSWORD:-helpdesk_dev_pass}@helpdesk_db:5432/${POSTGRES_DB:-college_helpdesk_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-helpdesk_redis_pass}@helpdesk_redis:6379/0
      CORS_ORIGINS: http://localhost:5175,http://localhost:3000
    ports:
      - "8005:8005"
    depends_on:
      helpdesk_db:
        condition: service_healthy
      helpdesk_redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8005 --reload
    profiles:
      - full-stack

volumes:
  helpdesk_pgdata:
  helpdesk_redisdata:
